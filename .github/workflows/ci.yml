# GitHub Actions CI: syntax checks, shellcheck, and the unit tests.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends shellcheck python3

      - name: Syntax
        run: |
          for f in bin/_common.sh bin/transcribe bin/extract bin/init-library; do bash -n "$f"; done
          python3 -m py_compile bin/check bin/lib/*.py tests/*.py

      - name: Shellcheck
        run: shellcheck -x bin/_common.sh bin/transcribe bin/extract bin/init-library

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
